name: CI/CD Build & Deploy to 1GB VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 1. BUILD & PUSH BACKEND IMAGE
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./Backend-Spring
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phyna-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. BUILD & PUSH FRONTEND IMAGE
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend-ReactJS
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phyna-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to 1GB DigitalOcean VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Ensure project directory exists on server
            mkdir -p /root/phyna-hairs-ecommerce
            cd /root/phyna-hairs-ecommerce

            # 2. Write Production Secrets .env
            echo "${{ secrets.ENV_FILE }}" > .env

            # 3. Download latest docker-compose.prod.yml from GitHub
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml -o docker-compose.prod.yml

            # 4. Login to GitHub Container Registry on Server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Export Repository Owner for docker-compose.prod.yml
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # 6. Pull pre-built images and restart containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 7. Clean up old images to save disk space
            docker image prune -f