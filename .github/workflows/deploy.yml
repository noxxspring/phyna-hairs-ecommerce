name: CI/CD Build & Deploy to Oracle Cloud ARM

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup QEMU to cross-compile for ARM64 architecture
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Ensure repository owner is lowercase for ghcr.io
      - name: Lowercase Repository Owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      # 4. Authenticate to GHCR
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. BUILD & PUSH BACKEND (Targeting ARM64)
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend-Spring
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/phyna-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. BUILD & PUSH FRONTEND (Targeting ARM64)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend-ReactJS
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/phyna-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud ARM VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Target application directory in user's home folder
            APP_DIR="$HOME/phyna-hairs-ecommerce"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write Production Secrets .env
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            # Download latest docker-compose.yml
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml -o docker-compose.yml

            # Set lowercase owner variable for docker-compose substitution
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Login to ghcr.io on the Oracle Server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and Restart Containers
            docker compose pull || docker-compose pull
            docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans

            # Clean unused build cache/images to save the 200GB disk
            docker image prune -f