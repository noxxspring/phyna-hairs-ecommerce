# Server
server.port=${PORT:9000}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wig_shop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Settings
jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_phynahairs_2026_safe_fallback_key}
jwt.header=Authorization
jwt.expiration-ms=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Flutterwave Configuration
flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:FLWSECK_TEST-xxx}
flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:FLWPUBK_TEST-xxx}
flutterwave.redirect-url=${FLUTTERWAVE_REDIRECT_URL:http://localhost:3000/payment/callback}

# Enable Detailed Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.phynahairs.ecommerce=DEBUG