# 1. HTTP Server (Auto-redirects http:// to https://)
server {
    listen 80;
    server_name phynahairs.duckdns.org;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server (Encrypted Port 443)
server {
    listen 443 ssl;
    server_name phynahairs.duckdns.org;

    # Path to Let's Encrypt SSL Certificates inside container
    ssl_certificate /etc/letsencrypt/live/phynahairs.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phynahairs.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}